# Default sensitivity configuration for UAM optimization
# This file contains default values for sensitivity analysis parameters

# Number of Monte Carlo simulations per choice evaluation
# Higher values provide more accurate results but take longer to compute
# Default: 1000 simulations
numSimulations=1000

# Charging rate in kWh per second
# This affects battery charging speed for electric vehicles
# Default: 0.104 kWh/s (equivalent to 6.24 kWh/min, which is 3C charging rate)
# Based on EVTOLBatteryManager.DEFAULT_CHARGING_RATE_KWH_PER_SECOND
chargingRateKwhPerSecond=0.104

# Note: Fixed pooling parameters (not configurable via this file)
# - Pooling time window: 3.0 minutes
# - Origin search radius: 6000.0 meters  
# - Destination search radius: 6000.0 meters
# These values are hardcoded in SensitivityConfig.java as requested